writer1 = console
writer1.level = debug
writer1.charset = UTF-8
writer1.format = {date: HH:mm:ss} [{level}] {message}

writer2 = rolling file
writer2.level = debug
writer2.charset = UTF-8
writer2.file = logs/bnbemu-{date: yyyy-MM-dd}.log
writer2.latest = logs/bnbemu.log
writer2.policies = startup, daily: 00:00
writer2.backups = 7
writer2.buffered = false
writer2.format = {date: yyyy-MM-dd HH:mm:ss.SSS} [{thread}] [{level}] {class-name}: {message}
